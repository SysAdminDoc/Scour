name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        run: dotnet publish src/Scour.App/Scour.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scour-win-x64
          path: publish/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload ${{ github.ref_name }} publish/Scour.App.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
